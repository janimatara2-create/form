<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div class="container">
        <div class="form-header" >
        <h6 style="font-size: larger; font-weight: bolder; text-align: center; font-family: Arial, Helvetica, sans-serif;">Job Fair 2026</h6>
<p style="text-align: center; ">Register now and connect with top employees</p>

</div>
        <!-- Progress Bar -->
        <div class="progress-container">

            <div class="progress-line">
                <div class="progress"></div>
            </div>

            <div class="step active">
                <span>1</span>
                <small>Personal</small>
            </div>

            <div class="step">
                <span>2</span>
                <small>Professional</small>
            </div>

            <div class="step">
                <span>3</span>
                <small>Confirmation</small>
            </div>

        </div>

        <!-- Feedback Message -->
        <div id="message"></div>
        
    <form action="" id="job form" style=" text-align: center;">
        <!-- Step1 -->
         <label for="First name" style="font-family: Arial, Helvetica, sans-serif;">First name</label>
         <input type="text" placeholder="Enter your first name" style="border: solid 1px grey; margin: 20px; padding: 10px; padding-left: 20px; border-radius: 7px;">
         <br>
          <label for="Last name" style="font-family: Arial, Helvetica, sans-serif;">Last name</label>
         <input type="text" placeholder="Enter your last name" style="border: solid 1px grey; margin: 20px; padding: 10px; padding-left: 20px; border-radius: 7px;">
         <br>


        <label for="Last name" style="font-family: Arial, Helvetica, sans-serif;">Age</label>
         <input type="text" placeholder="Enter your age" style="border: solid 1px grey; margin: 20px; padding: 10px; padding-left: 20px; border-radius: 7px;">
         <br>



        <label for="Last name" style="font-family: Arial, Helvetica, sans-serif;">Date of Birth</label>
         <input type="text" placeholder="10/6/2026" style="border: solid 1px grey; margin: 20px; padding: 10px; padding-left: 20px; border-radius: 7px;">
         <br>




          <label for="Email Address" style="font-family: Arial, Helvetica, sans-serif;">Email Address</label>
         <input type="text" placeholder="example@gmail.com" style="border: solid 1px grey; margin: 20px; padding: 10px; padding-left: 20px; border-radius:7px;">
         <br>

          <label for="Phone number" style="font-family: Arial, Helvetica, sans-serif;">Phone number</label>
         <input type="text" placeholder="12345678" style="border: solid 1px grey; margin: 20px; padding: 10px; padding-left: 20px; border-radius:7px;">
         <br>


         <label for="location" style="font-family: Arial, Helvetica, sans-serif;">Location</label>

<select name="location" id="location" style="border: solid 1px grey; margin: 20px; padding: 10px; padding-left: 20px; border-radius: 7px;">
  <option value="">Select your location</option>
  <option value="US">US</option>
  <option value="Puerto Rico">Puerto Rico</option>
  <option value="Mexico">Mexico</option>
</select>
 <button>Next</button>
    </form>

   <!-- Next step -->
     <form action="" id="job form" style=" text-align: center;">
        <!-- Step1 -->
         <label for="Highest Qualification" style="font-family: Arial, Helvetica, sans-serif;">Highest Qualification</label>
        <select name="Highest Qualification" id="Highest Qualification" style="border: solid 1px grey; margin: 20px; padding: 10px; padding-left: 20px; border-radius: 7px;">
  <option value="">Select Qualification</option>
  <option value="US">US</option>
  <option value="Puerto Rico">Puerto Rico</option>
  <option value="Mexico">Mexico</option>
</select>
         <br>
          <label for="Field of Study" style="font-family: Arial, Helvetica, sans-serif;">Field of Study</label>
         <input type="text" placeholder="e.g Computer Science" style="border: solid 1px grey; margin: 20px; padding: 10px; padding-left: 20px; border-radius: 7px;">
         <br>

          <label for="Email Address" style="font-family: Arial, Helvetica, sans-serif;">Email Address</label>
         <input type="text" placeholder="example@gmail.com" style="border: solid 1px grey; margin: 20px; padding: 10px; padding-left: 20px; border-radius:7px;">
         <br>

          <label for="Years of Experience" style="font-family: Arial, Helvetica, sans-serif;">Years of Experience</label>
        <select name="Years of Experience" id="Years of Experience" style="border: solid 1px grey; margin: 20px; padding: 10px; padding-left: 20px; border-radius: 7px;">
  <option value="">Select Experience</option>
  <option value="US">1 year</option>
  <option value="Puerto Rico">2 years</option>
  <option value="Mexico">3 years</option>
</select>


         <label for="Preferred Job role" style="font-family: Arial, Helvetica, sans-serif;">Preferred Job role</label>
<input type="text" placeholder="e.g. Frontend Developer">


<p>Employment Type</p>
  <input type="radio" id="html" name="fav_language" value="HTML">
  <label for="Full-time">Full-time</label><br>

  <input type="radio" id="css" name="fav_language" value="CSS">
  <label for="Part-time">Part-time</label><br>

  <input type="radio" id="javascript" name="fav_language">
  <label for="Internship">Internship</label><br>
 <button>Next</button>
    </form>
</div>
</body>
</html>
